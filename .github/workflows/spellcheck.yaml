name: Spell Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "GEMINI.md"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "GEMINI.md"

permissions:
  contents: read

jobs:
  check:
    name: Check Spelling
    runs-on: ubuntu-26.04
    steps:
      - name: 🛡️ Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 📦 Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: 📦 Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: ⚒️ Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.15

      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install pyspelling

      - name: ⚙️ Install Aspell
        run: |
          sudo apt-get install aspell aspell-en

      - name: 🔍 Spell check
        run: |
          python -m pyspelling
